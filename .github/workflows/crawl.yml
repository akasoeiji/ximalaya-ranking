name: Crawl Ranking (爬取与发布)

on:
  workflow_dispatch:                # 手动执行
    inputs:
      pages:
        description: "分类分页数(默认50, 每页40张, 作用于所有分类)"
        required: false
        default: "50"
      max_anchors:
        description: "限制每个分类主播抓取数(0=全部)"
        required: false
        default: "0"
  schedule:                         # 定时任务: 每天 UTC 02:00 = 北京 10:00
    - cron: "0 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run crawler & build report
        run: |
          python -m xmr.run_all \
            --out output \
            --pages "${{ github.event.inputs.pages || '50' }}" \
            --max-anchors "${{ github.event.inputs.max_anchors || '0' }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ranking-output
          path: output

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
